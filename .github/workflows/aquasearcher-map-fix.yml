name: AquaSearcher map fix
on:
  push:
    branches: [main]

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix map dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = s
          s = s.replace('https://unpkg.com/leaflet@1.9.4/dist/leaflet.css', 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css')
          s = s.replace('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js', 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js')
          s = s.replace('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
          s = s.replace("{attribution:'© Esri, HERE, Garmin, Intermap, increment P Corp., GEBCO, USGS, FAO, NPS, NRCAN, GeoBase, IGN, Kadaster NL, Ordnance Survey, Esri Japan, METI, Esri China (Hong Kong), (c) OpenStreetMap contributors, and the GIS User Community'}", "{attribution:'© OpenStreetMap contributors'}")
          if s == old:
              raise SystemExit('No expected map strings were found; refusing to commit a no-op.')
          p.write_text(s)
          print('Map CDN/tile references updated.')
          PY

      - name: Verify JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S)
          if not scripts:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/aqua-inline.js').write_text('\n'.join(scripts))
          print('Inline script extracted for syntax check.')
          PY
          node --check /tmp/aqua-inline.js

      - name: Verify CDN endpoints
        run: |
          curl -fsSLI --max-time 20 https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js >/dev/null
          curl -fsSLI --max-time 20 https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css >/dev/null
          curl -fsSLI --max-time 20 https://a.tile.openstreetmap.org/12/655/1534.png >/dev/null
          echo 'CDN and map tile endpoints responded.'

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix AquaSearcher map loading' || echo 'No changes to commit'
          git push
