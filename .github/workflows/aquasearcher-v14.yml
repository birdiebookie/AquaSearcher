name: Apply AquaSearcher V16

on:
  push:
    branches: [main]
    paths:
      - 'v14-improvements.js'
      - 'v15-historical-access.js'
      - 'historical-evidence.js'
      - 'v16-access-crawler.js'
      - 'v16-bootstrap.js'
      - '.github/workflows/aquasearcher-v14.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject AquaSearcher V16 access crawler
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for tag in [
              '<script src="v14-improvements.js"></script>',
              '<script src="historical-evidence.js"></script>',
              '<script src="v15-historical-access.js"></script>',
              '<script src="v16-access-crawler.js"></script>',
              '<script src="v16-bootstrap.js"></script>'
          ]:
              if tag not in s:
                  if '</body>' not in s:
                      raise SystemExit('index.html has no </body> marker')
                  s=s.replace('</body>', tag+'\n</body>', 1)
          s=s.replace('AquaSearcher V13','AquaSearcher V16')
          s=s.replace('AquaSearcher V14','AquaSearcher V16')
          s=s.replace('AquaSearcher V15','AquaSearcher V16')
          s=s.replace('<small>V13</small>','<small>V16</small>')
          s=s.replace('<small>V14</small>','<small>V16</small>')
          s=s.replace('<small>V15</small>','<small>V16</small>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/aqua-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('JavaScript files prepared for syntax check.')
          PY
          node --check /tmp/aqua-inline.js
          node --check v14-improvements.js
          node --check historical-evidence.js
          node --check v15-historical-access.js
          node --check v16-access-crawler.js
          node --check v16-bootstrap.js
      - name: Commit V16
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v14-improvements.js v15-historical-access.js historical-evidence.js v16-access-crawler.js v16-bootstrap.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Add exhaustive ramps and road-end access crawler [skip ci]'
          git push
