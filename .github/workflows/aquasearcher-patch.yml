name: AquaSearcher V11 finish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V11 finishing fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          original=s

          # One zoom control only; the explicit Leaflet +/- control remains.
          s=s.replace("L.map('map',{zoomControl:true})", "L.map('map',{zoomControl:false})", 1)

          # Current-location button.
          if 'id="myloc"' not in s:
              s=s.replace('<button class="btn2" id="find">⌖ FIND LOCATION</button>', '<div class="row"><button class="btn2" id="find" style="flex:1">⌖ FIND LOCATION</button><button class="btn2" id="myloc" style="width:46px" title="Use my current location">⌖</button></div>', 1)

          marker="$('find').onclick=async()=>{try{await geocode()}catch(e){toast(e.message)}};"
          if "$('myloc').onclick" not in s and marker in s:
              s=s.replace(marker, marker+"$('myloc').onclick=()=>{if(!navigator.geolocation){toast('Location services are not available in this browser.');return}toast('Getting your current location…');navigator.geolocation.getCurrentPosition(pos=>{coordinateSearch=true;setPin(pos.coords.latitude,pos.coords.longitude);toast('Current location loaded.');},err=>toast('Could not get your location: '+(err.message||'permission denied')),{enableHighAccuracy:true,timeout:10000,maximumAge:30000})};", 1)

          # Prevent the crawl from advancing if PAUSE is pressed during a step delay.
          s=s.replace('await pauseWait();await sleep(100)};await step(5,', 'await pauseWait();await sleep(100);await pauseWait()};await step(5,', 1)

          if s==original:
              raise SystemExit('No V11 changes matched')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Finish AquaSearcher V11 controls and pause behavior' || true
          git push
