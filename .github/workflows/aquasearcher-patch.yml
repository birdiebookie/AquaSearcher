name: AquaSearcher V11 finish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish V11 targeted fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # Keep one zoom-control instance and restore the visible +/- controls.
          s=s.replace("L.map('map',{zoomControl:true})", "L.map('map',{zoomControl:false})", 1)

          # Add a browser-location refresh button next to FIND LOCATION.
          old='<button class="btn2" id="find">⌖ FIND LOCATION</button>'
          new='<div class="row"><button class="btn2" id="find" style="flex:1">⌖ FIND LOCATION</button><button class="btn2" id="myloc" style="width:46px" title="Use my current location">⌖</button></div>'
          if old in s and 'id="myloc"' not in s:
              s=s.replace(old,new,1)

          # Make pause/resume stop advancement even when pause is pressed during a short wait.
          old='async function pauseWait(){while(paused){$(\'status\').textContent=\'Paused — press RESUME to continue.\';await sleep(100)}}'
          new='async function pauseWait(){while(paused){$(\'status\').textContent=\'Paused — press RESUME to continue.\';await sleep(100)}}'
          # pauseWait is already correct in V11; keep it explicit for this patch.

          old='async function run(){if(state===\'searching\')return;'
          # no-op marker check: fail if the expected V11 run function disappeared.
          if old not in s:
              raise SystemExit('V11 run function not found')

          # Re-check pause after the step delay so the crawl cannot advance while paused.
          old='await pauseWait();await sleep(100)};await step(5,'
          new='await pauseWait();await sleep(100);await pauseWait()};await step(5,'
          if old not in s:
              raise SystemExit('step pause pattern not found')
          s=s.replace(old,new,1)

          # Browser geolocation refresh: update the pin and search field without changing the rest of the crawl.
          marker="$('find').onclick=async()=>{try{await geocode()}catch(e){toast(e.message)}};"
          geo="""$('find').onclick=async()=>{try{await geocode()}catch(e){toast(e.message)}};\n$('myloc').onclick=()=>{if(!navigator.geolocation){toast('Location services are not available in this browser.');return}toast('Getting your current location…');navigator.geolocation.getCurrentPosition(pos=>{coordinateSearch=true;setPin(pos.coords.latitude,pos.coords.longitude);toast('Current location loaded.');},err=>toast('Could not get your location: '+(err.message||'permission denied')), {enableHighAccuracy:true,timeout:10000,maximumAge:30000})};"""
          if marker not in s:
              raise SystemExit('location marker not found')
          if "$('myloc').onclick" not in s:
              s=s.replace(marker,geo,1)

          p.write_text(s)
          PY
          if git diff --quiet; then
            echo 'No changes made'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Finish AquaSearcher V11 pause and location controls'
          git push
          rm -f .github/workflows/aquasearcher-patch.yml
          git add -A
          git commit -m 'Remove one-time V11 patch workflow'
          git push
