name: AquaSearcher V12 map repair
on:
  workflow_dispatch:
  push:
    paths:
      - .v12-map-trigger
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair map fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<title>AquaSearcher V11</title>','<title>AquaSearcher V12</title>')
          s=s.replace('V11</small>','V12</small>')
          s=s.replace('.layout{display:grid;', '#map{background:transparent!important}.mapFallback{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:0}.layout{display:grid;')
          old='<div id="map" style="height:700px"></div>'
          new='<div id="map" style="height:700px;position:relative;overflow:hidden"><iframe class="mapFallback" title="OpenStreetMap fallback" src="https://www.openstreetmap.org/export/embed.html?bbox=-84.75,39.20,-84.35,39.50&amp;layer=mapnik"></iframe></div>'
          if old in s:
              s=s.replace(old,new,1)
          oldtile="L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);"
          newtile="const osmTiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'});osmTiles.on('tileerror',()=>{if(!window.__tileFallback){window.__tileFallback=true;L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap contributors © CARTO'}).addTo(map)}});osmTiles.addTo(map);setTimeout(()=>map.invalidateSize(),250);"
          if oldtile in s:
              s=s.replace(oldtile,newtile,1)
          p.write_text(s)
          print('V12 repair applied', 'iframe=', '<iframe class="mapFallback"' in s, 'tileFallback=', 'cartocdn.com' in s)
          PY
      - name: Verify
        run: |
          grep -o 'AquaSearcher V12' index.html | head -1
          grep -o 'openstreetmap.org/export/embed' index.html | head -1
          grep -o 'cartocdn.com/light_all' index.html | head -1
      - name: Commit repair and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair V12 map with fallback and tile recovery"
          git push
          git rm .v12-map-trigger .github/workflows/map-v12.yml
          git commit -m "Remove V12 repair workflow"
          git push
